# config/config.yaml
# Single source of truth for all tunable parameters.
# ADR-006: Single YAML config loaded at each entry point, parsed by Pydantic.
# Rule: every number that affects pipeline behavior or model quality lives here,
# not as a magic constant in source code.
#
# API keys (Spotify, Genius) live in .env ONLY — never here.

pipeline:
  checkpoint_interval: 100        # tracks per checkpoint parquet file (ADR-002)
  fuzzy_match_threshold: 85       # rapidFuzz title similarity threshold (scope.md §preprocessing)
  artist_match_threshold: 70      # two-pass artist similarity (failure_modes.md §1.1)
  suspicious_artist_threshold: 40 # flag-not-drop zone for artist similarity
  max_lyrics_tokens: 200          # truncate lyrics before LLM prompt (scope.md)
  min_lyrics_tokens: 20           # below this → treat as missing (failure_modes.md §1.2)
  speechiness_max: 0.5            # filter podcasts/comedy miscategorized in FMA (failure_modes.md §1.3)
  duration_ms_min: 30000          # filter intros/outros/stingers (failure_modes.md §1.3)
  dedup_similarity_threshold: 0.98  # post-index cosine dedup threshold (failure_modes.md §1.4)

enrichment:
  llm_backend: "lmstudio"         # lmstudio (MLX, local dev) | ollama (Docker/Linux sidecar)
  llm_model: "mistral-7b-instruct-v0.3"   # must match server's model id (GET /v1/models); ADR-001 Mistral 7B
  llm_base_url: "http://localhost:1234/v1"  # LM Studio OpenAI server; ollama path: http://localhost:11434
  llm_timeout_s: 60               # raised from 30: LM Studio JIT cold-load can exceed 30s (failure_modes.md §4.3)
  max_retries: 3                  # exponential backoff: 1s, 2s, 4s
  prompt_version: "v2"            # bump when prompt template changes → forces rebuild (ADR-006 invariant 1)
  descriptor_version: "v2"        # artifact versioning tag; changing forces full rebuild

retrieval:
  bi_encoder: "BAAI/bge-base-en-v1.5"                      # ADR-001
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2"    # ADR-001
  ann_top_k: 50                   # Stage 1 ANN candidates (scope.md §two-stage retrieval)
  rerank_top_k: 10                # Stage 2 final playlist size
  confidence_threshold: 0.65      # auto-routing: full vs metadata-only index (ADR-006)
  rerank_variance_threshold: 0.05 # fallback to ANN order if cross-encoder is flat (failure_modes.md §2.3)
  collapse_genre_threshold: 0.8   # retrieval collapse detection (failure_modes.md §2.2)
  bm25_weight: 0.5                # RRF fusion weight for BM25 vs dense (scope.md §hybrid retrieval)
  rrf_k: 60                       # RRF constant k parameter
  use_dense: true                 # ablation flag: enable/disable dense ANN retrieval
  use_bm25: true                  # ablation flag: enable/disable BM25 retrieval
  use_reranker: true              # ablation flag: enable/disable cross-encoder reranking

training:
  output_dir: "checkpoints/biencoder"   # ADR-003
  num_epochs: 10
  batch_size: 32                  # target 32–64 pairs on M1 Max MPS (ADR-003)
  hard_negative_weight: 0.3       # combined loss: 0.7 in-batch + 0.3 hard negatives (ADR-003)
  in_batch_weight: 0.7
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  save_total_limit: 3             # disk space management (failure_modes.md §4.1)
  hard_negative_mine_top_k: 20    # mine from top-20 bge-base neighbors before fine-tuning

eval:
  queries_path: "eval/queries.json"
  results_path: "eval/results.csv"
  baseline_metrics_path: "eval/baseline_metrics.json"
  ndcg_k: 10                      # NDCG@10 primary metric (ADR-003, scope.md)
  mrr_k: 10
  precision_k: 10
  novelty_k: 10
  early_stop_patience: 3          # NDCG@10-based early stopping (ADR-003)
  early_stop_min_delta: 0.005
  smoke_test_n_queries: 10        # CI eval job subset (scope.md §CI/CD)
  regression_threshold: 0.05      # fail CI if NDCG drops >5% from baseline

tensorboard:
  log_dir: "runs/"                # ADR-004
  log_every_n_steps: 50           # configurable step-level logging

paths:
  data_dir: "data/"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  chroma_dir: "chroma_db/"
  checkpoints_dir: "checkpoints/"

# Essentia audio-feature extraction (ADR-002 amendment 2026-06-12)
# Replaces EchoNest coverage (13K tracks) by extracting from FMA audio (106K).
audio:
  hf_dataset: "benjamin-paine/free-music-archive-large"  # streamed, no full download
  sample_rate: 16000              # Essentia effnet/yamnet models expect 16 kHz mono
  models_dir: "checkpoints/essentia_models"
  checkpoint_interval: 200        # tracks per parquet checkpoint (resume granularity)
  genre_top_k: 3                  # top-N labels: Genre-Discogs400
  mood_top_k: 3                   # top-N labels: mtg-jamendo moodtheme
  instrument_top_k: 4             # top-N labels: mtg-jamendo instrument
  audioset_mood_top_k: 2          # top-N labels: YAMNet AudioSet music-mood subtree
  danceability_threshold: 1.0     # Essentia Danceability ~[0,3] → "danceable"/"non-danceable" (tune)
  energy_norm: 10.0               # DynamicComplexity (dB-ish) → 0-1 energy proxy divisor (coarse)

# Feature valid ranges for Spotify audio features (failure_modes.md §1.3)
feature_valid_ranges:
  tempo:        [40.0, 250.0]
  loudness:     [-60.0, 0.0]
  energy:       [0.0, 1.0]
  valence:      [0.0, 1.0]
  acousticness: [0.0, 1.0]
  danceability: [0.0, 1.0]
  speechiness:  [0.0, 1.0]
