[pytest]
# pytest configuration
# scope.md §CI/CD: test job triggers on every push.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: marks tests that require external services (ChromaDB, Ollama)
    smoke: marks tests included in the CI smoke test subset
    slow: marks tests that are slow (deselect with -m "not slow")

# Coverage
addopts = --tb=short -q

# Async support (Genius crawler tests)
asyncio_mode = auto
